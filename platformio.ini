; PlatformIO build for the InstaScreen firmware.
; The sketch stays Arduino-IDE compatible; this file adds pinned dependencies,
; reproducible builds, host-side unit tests and CI.

[platformio]
src_dir = firmware/InstaScreen
test_dir = firmware/test
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bodmer/TJpg_Decoder@1.1.0
    bblanchon/ArduinoJson@7.2.1
; TFT_eSPI configuration as build flags (mirrors firmware/tft_setup/), so no
; edits inside the library folder are needed.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_PARALLEL_8_BIT=1
    -D TFT_CS=27
    -D TFT_DC=14
    -D TFT_RST=26
    -D TFT_WR=12
    -D TFT_RD=13
    -D TFT_D0=16
    -D TFT_D1=4
    -D TFT_D2=23
    -D TFT_D3=22
    -D TFT_D4=21
    -D TFT_D5=19
    -D TFT_D6=18
    -D TFT_D7=17
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1  ; silence TOUCH_CS notice (no touch panel used)
test_ignore = *

; Host-side unit tests for the platform-independent core (codec, backoff).
;   pio test -e native
[env:native]
platform = native
build_src_filter = -<*> +<codec.cpp>
test_build_src = yes
build_flags = -std=c++17 -Wall -Wextra

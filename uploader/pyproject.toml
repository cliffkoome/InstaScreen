[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instascreen-uploader"
version = "2.0.0"
description = "Ingestion CLI for InstaScreen: prepares JPEGs for the ESP32 and publishes them to Firebase RTDB."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]

[project.scripts]
instascreen = "instascreen_uploader.cli:main"

[tool.setuptools]
packages = ["instascreen_uploader"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
